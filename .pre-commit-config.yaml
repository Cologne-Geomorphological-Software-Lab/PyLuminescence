# Pre-commit hooks. Local hooks run via `uv run` so hook versions always
# match the locked project toolchain.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: ^uv\.lock$

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python]
        require_serial: true

      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types_or: [python]
        pass_filenames: false

      - id: xenon
        name: xenon (complexity gate)
        entry: uv run xenon --max-absolute B --max-modules B --max-average A src/luminescence
        language: system
        types_or: [python]
        pass_filenames: false
        stages: [manual]

      - id: bandit
        name: bandit (security)
        entry: uv run bandit -r src/luminescence
        language: system
        types_or: [python]
        pass_filenames: false

      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture src/luminescence tests --min-confidence 80
        language: system
        types_or: [python]
        pass_filenames: false

      - id: pylint-duplicate-code
        name: pylint (duplicate code)
        entry: uv run pylint --disable=all --enable=duplicate-code src/luminescence
        language: system
        types_or: [python]
        pass_filenames: false
        stages: [manual]
